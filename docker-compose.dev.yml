# Local development only. This stack builds Home and AI48Proxy from sibling source.
# Run from the AI48Home repository with AI48Proxy checked out as a sibling.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ai48home-dev-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai48home}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
      POSTGRES_DB: ${POSTGRES_DB:-ai48home}
    volumes:
      - ai48home-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ai48proxy-dev]

  ai48home:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-working-tree}
        BUILD_DATE: ${BUILD_DATE:-local}
    image: ai48home:dev
    container_name: ai48home-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOME_USER_EMAIL_SMTP_PASSWORD: ""
    ports:
      - "${AI48HOME_PORT:-8327}:8327"
    volumes:
      - .:/workspace
      - ./cluster.dev.yaml:/workspace/cluster.yaml:ro
      - ./config.dev.yaml:/workspace/config.yaml:ro
      - ai48home-dev-data:/workspace/data
      - ./logs.dev:/workspace/logs.dev
      - ./plugins.dev:/workspace/plugins.dev
    networks: [ai48proxy-dev]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-MANAGEMENT-KEY: dev-management-key' http://127.0.0.1:8327/v8/management/nodes >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  ai48proxy:
    build:
      context: ../AI48Proxy
      dockerfile: Dockerfile.dev
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:bookworm}
    image: ai48proxy:dev
    container_name: ai48proxy-dev
    init: true

    command: ["cargo", "watch", "--why", "-x", "run -- --identity-dir /var/lib/ai48proxy/identity"]
    environment:
      HOME_JWT_FILE: /run/secrets/home_jwt
      RUST_LOG: ${RUST_LOG:-ai48proxy=debug}
      WORKER_START_DELAY: ${WORKER_START_DELAY:-0}
    depends_on:
      ai48home:
        condition: service_healthy
    ports:
      - "${AI48PROXY_PORT:-8317}:8317"
    volumes:
      - ../AI48Proxy:/workspace
      - ai48proxy-dev-state:/var/lib/ai48proxy
      - ai48proxy-dev-target:/workspace/target
      - ai48proxy-dev-cargo:/usr/local/cargo/registry
      - type: bind
        source: ${HOME_JWT_FILE:-./home.jwt}
        target: /run/secrets/home_jwt
        read_only: true
    networks: [ai48proxy-dev]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8317/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3


volumes:
  ai48home-dev-postgres:
  ai48home-dev-data:
  ai48proxy-dev-state:
  ai48proxy-dev-target:
  ai48proxy-dev-cargo:

networks:
  ai48proxy-dev:
    name: ai48proxy-dev-network
