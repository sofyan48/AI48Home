apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai48home.fullname" . }}-home-env
  labels:
    {{- include "ai48home.labels" . | nindent 4 }}
data:
  {{- $home := mergeOverwrite (dict "TZ" .Values.timezone) (deepCopy .Values.home.environment) }}
  {{- range $key, $value := $home }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai48home.fullname" . }}-worker-env
  labels:
    {{- include "ai48home.labels" . | nindent 4 }}
data:
  {{- $workers := mergeOverwrite (deepCopy .Values.workers.environment) (dict "TZ" .Values.timezone "WORKER_START_DELAY" (.Values.workers.startDelaySeconds | toString) "HOME_URL" (printf "http://%s-home:8327" (include "ai48home.fullname" .))) }}
  {{- range $key, $value := $workers }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai48home.fullname" . }}-postgresql-env
  labels:
    {{- include "ai48home.labels" . | nindent 4 }}
data:
  {{- $postgres := mergeOverwrite (deepCopy .Values.postgresql.environment) (dict "TZ" .Values.timezone "POSTGRES_USER" .Values.postgresql.auth.username "POSTGRES_DB" .Values.postgresql.auth.database "PGDATA" "/var/lib/postgresql/data/pgdata" "PGHOST" (include "ai48home.databaseHost" .) "PGPORT" ((ternary .Values.postgresql.port .Values.postgresql.external.port .Values.postgresql.enabled) | toString) "PGUSER" .Values.postgresql.auth.username "PGDATABASE" .Values.postgresql.auth.database "PGSSLMODE" (ternary .Values.postgresql.sslmode .Values.postgresql.external.sslmode .Values.postgresql.enabled) "PGCONNECT_TIMEOUT" "5") }}
  {{- range $key, $value := $postgres }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
