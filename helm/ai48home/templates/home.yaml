apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai48home.fullname" . }}-home
  labels:
    {{- include "ai48home.labels" . | nindent 4 }}
    app.kubernetes.io/component: home
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "ai48home.storageClass" (dict "persistence" .Values.home.persistence "global" .Values.global) | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.home.persistence.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai48home.fullname" . }}-home
  labels:
    {{- include "ai48home.labels" . | nindent 4 }}
    app.kubernetes.io/component: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ai48home.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: home
  template:
    metadata:
      labels:
        {{- include "ai48home.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: home
      annotations:
        checksum/environment: {{ include (print $.Template.BasePath "/environment.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: database-check
          image: {{ printf "%s:%s" .Values.postgresql.image.repository .Values.postgresql.image.tag | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command: ["sh", "-eu", "-c"]
          args:
            - |
              mkdir -p /home-storage/data /home-storage/logs /home-storage/plugins
              rm -f /bootstrap/import-needed
              attempt=0
              until pg_isready -t 2; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 60 ]; then
                  echo "PostgreSQL did not become ready after 60 attempts" >&2
                  exit 1
                fi
                sleep 2
              done
              # Check the relation separately so a fresh database never queries a missing table.
              table_exists=$(psql -X -w -v ON_ERROR_STOP=1 -Atc "SELECT to_regclass('public.config') IS NOT NULL;")
              case "$table_exists" in
                t)
                  config_exists=$(psql -X -w -v ON_ERROR_STOP=1 -Atc "SELECT EXISTS (SELECT 1 FROM public.config);")
                  ;;
                f) config_exists=f ;;
                *) echo "Unexpected config table check result" >&2; exit 1 ;;
              esac
              case "$config_exists" in
                t) echo "Database config exists; skipping import" ;;
                f) touch /bootstrap/import-needed ;;
                *) echo "Unexpected config row check result" >&2; exit 1 ;;
              esac
          envFrom:
            - configMapRef:
                name: {{ include "ai48home.fullname" . }}-postgresql-env
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai48home.fullname" . }}-config
                  key: postgres-password
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
            - name: home-data
              mountPath: /home-storage
        - name: import-config
          image: {{ printf "%s:%s" .Values.home.image.repository .Values.home.image.tag | quote }}
          imagePullPolicy: {{ .Values.home.image.pullPolicy }}
          workingDir: /AI48Home
          command: ["sh", "-eu", "-c"]
          args:
            - |
              if [ -f /bootstrap/import-needed ]; then
                ./AI48Home -import
                rm -f /bootstrap/import-needed
              fi
          envFrom:
            - configMapRef:
                name: {{ include "ai48home.fullname" . }}-home-env
          resources:
            {{- toYaml .Values.home.resources | nindent 12 }}
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
            - name: cluster-config
              mountPath: /AI48Home/cluster.yaml
              subPath: cluster.yaml
              readOnly: true
            - name: import-config
              mountPath: /AI48Home/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: home-data
              mountPath: /AI48Home/data
              subPath: data
            - name: home-data
              mountPath: /AI48Home/logs
              subPath: logs
            - name: home-data
              mountPath: /AI48Home/plugins
              subPath: plugins
      containers:
        - name: home
          image: {{ printf "%s:%s" .Values.home.image.repository .Values.home.image.tag | quote }}
          imagePullPolicy: {{ .Values.home.image.pullPolicy }}
          workingDir: /AI48Home
          command: ["./AI48Home"]
          envFrom:
            - configMapRef:
                name: {{ include "ai48home.fullname" . }}-home-env
          ports:
            - name: home
              containerPort: 8327
          startupProbe:
            tcpSocket:
              port: home
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: home
            periodSeconds: 5
          resources:
            {{- toYaml .Values.home.resources | nindent 12 }}
          volumeMounts:
            - name: cluster-config
              mountPath: /AI48Home/cluster.yaml
              subPath: cluster.yaml
              readOnly: true
            - name: home-data
              mountPath: /AI48Home/data
              subPath: data
            - name: home-data
              mountPath: /AI48Home/logs
              subPath: logs
            - name: home-data
              mountPath: /AI48Home/plugins
              subPath: plugins
      volumes:
        - name: bootstrap
          emptyDir: {}
        - name: home-data
          persistentVolumeClaim:
            claimName: {{ include "ai48home.fullname" . }}-home
        - name: cluster-config
          secret:
            secretName: {{ include "ai48home.fullname" . }}-config
            items:
              - key: cluster.yaml
                path: cluster.yaml
        - name: import-config
          secret:
            secretName: {{ include "ai48home.fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
