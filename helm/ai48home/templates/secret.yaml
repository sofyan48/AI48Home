{{- $password := required "postgresql.auth.password is required" .Values.postgresql.auth.password -}}
{{- $management := include "ai48home.generatedSecret" (dict "ctx" $ "key" "management-key" "value" .Values.secrets.managementKey) -}}
{{- $apiKey := include "ai48home.generatedSecret" (dict "ctx" $ "key" "gateway-api-key" "value" .Values.secrets.gatewayApiKey) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai48home.fullname" . }}-config
  labels:
    {{- include "ai48home.labels" . | nindent 4 }}
type: Opaque
stringData:
  management-key: {{ $management | quote }}
  postgres-password: {{ $password | quote }}
  gateway-api-key: {{ $apiKey | quote }}
  config.yaml: |
    host: ""
    port: 8317
    allow-host: []
    remote-management:
      allow-remote: true
      secret-key: {{ $management | quote }}
      disable-control-panel: false
    auth-dir: "~/.ai48home"
    api-keys:
      - {{ $apiKey | quote }}
    debug: false
  cluster.yaml: |
    pgsql:
      host: {{ include "ai48home.databaseHost" . | quote }}
      port: {{ ternary .Values.postgresql.port .Values.postgresql.external.port .Values.postgresql.enabled }}
      user: {{ .Values.postgresql.auth.username | quote }}
      password: {{ $password | quote }}
      database: {{ .Values.postgresql.auth.database | quote }}
      sslmode: {{ ternary .Values.postgresql.sslmode .Values.postgresql.external.sslmode .Values.postgresql.enabled | quote }}
    node:
      external-ip: {{ printf "%s-home.%s.svc.%s" (include "ai48home.fullname" .) .Release.Namespace (.Values.clusterDomain | default "cluster.local") | quote }}
      external-port: 8327
      port: 8327
      heartbeat-interval: "5s"
      heartbeat-timeout: {{ printf "%ds" (int .Values.home.heartbeatTimeoutSeconds) | quote }}
      event-poll-interval: "3s"
