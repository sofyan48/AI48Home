apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai48home.fullname" . }}-home
  labels:
    {{- include "ai48home.labels" . | nindent 4 }}
    app.kubernetes.io/component: home
spec:
  type: {{ .Values.home.service.type }}
  selector:
    {{- include "ai48home.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: home
  ports:
    - name: home
      port: 80
      targetPort: home
    # Bootstrap and existing Home JWTs use this port for HTTP and RESP/mTLS.
    - name: home-cluster
      port: 8327
      targetPort: home
