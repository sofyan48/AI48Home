apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai48home.fullname" . }}-worker
  labels:
    {{- include "ai48home.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: {{ .Values.workers.service.type }}
  selector:
    {{- include "ai48home.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: worker-cluster
      port: 8317
      targetPort: http
