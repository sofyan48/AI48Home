{{- define "ai48home.workers.bootstrap" -}}
import base64
import json
import os
from pathlib import Path
import tempfile
import time
import urllib.request


def main():
    identity = Path("/identity")
    if not os.access(identity, os.W_OK):
        raise RuntimeError("Worker storage is not writable by the worker user")

    home = os.environ["HOME_URL"].rstrip("/")
    node_name = os.environ.get("NODE_NAME", "")
    headers = {"X-MANAGEMENT-KEY": os.environ["MANAGEMENT_KEY"]}
    deadline = time.monotonic() + 180
    while True:
        remaining = deadline - time.monotonic()
        if remaining <= 0:
            raise RuntimeError("Home readiness deadline exceeded")
        try:
            request = urllib.request.Request(home + "/v8/management/nodes", headers=headers)
            with urllib.request.urlopen(request, timeout=min(5, remaining)) as response:
                if response.status == 200:
                    break
        except Exception:
            # Do not print response bodies or exceptions that could contain credentials.
            pass
        time.sleep(min(2, max(0, deadline - time.monotonic())))

    token_path = identity / ".home-jwt"
    if token_path.exists():
        if not os.access(token_path, os.R_OK):
            raise RuntimeError("Saved worker identity is not readable by the worker user; fix PVC ownership")
        saved = token_path.read_text().strip()
        if not saved:
            raise RuntimeError("Saved worker identity is empty")
        payload = saved.split(".")[1]
        claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
        # Inspect only for a known legacy chart formatting defect; the worker verifies signatures.
        if "%!s(<nil>)" not in str(claims.get("ip", "")):
            token_path.chmod(0o600)
            return
        backup = identity / ".home-jwt.invalid-host.backup"
        if backup.exists():
            raise RuntimeError("Invalid identity backup already exists; manual recovery required")
        token_path.chmod(0o600)
        os.replace(token_path, backup)
        print("Backed up JWT with invalid advertised hostname; requesting a new identity", flush=True)

    # Do not retry enrollment: a lost response may already have created an identity.
    request = urllib.request.Request(
        home + "/v8/management/certificates/clients",
        headers={**headers, "Content-Type": "application/json"},
        data=json.dumps({"node_name": node_name}).encode(),
        method="POST",
    )
    with urllib.request.urlopen(request, timeout=15) as response:
        token = json.load(response).get("home_jwt")
    if not isinstance(token, str) or not token.strip():
        raise RuntimeError("Home returned no worker identity")

    descriptor, temporary = tempfile.mkstemp(prefix=".home-jwt-", dir=identity)
    try:
        with os.fdopen(descriptor, "w") as output:
            os.fchmod(output.fileno(), 0o600)
            output.write(token.strip())
            output.flush()
            os.fsync(output.fileno())
        os.replace(temporary, token_path)
    finally:
        if os.path.exists(temporary):
            os.unlink(temporary)


try:
    main()
except Exception:
    raise SystemExit("Worker bootstrap failed; verify Home readiness, credentials, and identity storage")
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai48home.fullname" . }}-worker-bootstrap
  labels:
    {{- include "ai48home.labels" . | nindent 4 }}
data:
  bootstrap.py: |
    {{- include "ai48home.workers.bootstrap" . | nindent 4 }}
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ai48home.fullname" . }}-workers
  labels:
    {{- include "ai48home.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ai48home.fullname" . }}-worker
  {{- if not .Values.workers.autoscaling.enabled }}
  replicas: {{ .Values.workers.replicas }}
  {{- end }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "ai48home.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "ai48home.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/bootstrap: {{ include "ai48home.workers.bootstrap" . | sha256sum }}
        checksum/environment: {{ include (print $.Template.BasePath "/environment.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      # Allow AI48Proxy to drain in-flight requests and usage reports before SIGKILL.
      terminationGracePeriodSeconds: {{ .Values.workers.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The AI48Proxy image runs as 10001; identity files must be owned by that user.
      securityContext:
        {{- toYaml .Values.workers.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if .Values.workers.fixPermissions }}
        # NFS volumes ignore fsGroup, and legacy PVCs contain root-owned files.
        - name: fix-permissions
          image: {{ .Values.bootstrap.image | quote }}
          command: ["sh", "-eu", "-c"]
          args:
            - |
              chown -R {{ .Values.workers.podSecurityContext.runAsUser }}:{{ .Values.workers.podSecurityContext.runAsGroup }} /identity
              chmod 0700 /identity
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          volumeMounts:
            - name: identity
              mountPath: /identity
        {{- end }}
        - name: bootstrap
          image: {{ .Values.bootstrap.image | quote }}
          command: ["python", "/bootstrap/bootstrap.py"]
          envFrom:
            - configMapRef:
                name: {{ include "ai48home.fullname" . }}-worker-env
          env:
            - name: MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai48home.fullname" . }}-config
                  key: management-key
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: identity
              mountPath: /identity
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: worker
          image: {{ printf "%s:%s" .Values.workers.image.repository .Values.workers.image.tag | quote }}
          imagePullPolicy: {{ .Values.workers.image.pullPolicy }}
          command: ["sh", "-eu", "-c"]
          args:
            - |
              # The binary applies WORKER_START_DELAY itself; only add the per-ordinal stagger here.
              ordinal="${HOSTNAME##*-}"
              export WORKER_START_DELAY="$((WORKER_START_DELAY + ordinal * 2))"
              exec /usr/local/bin/ai48proxy --identity-dir /var/lib/ai48proxy/identity
          envFrom:
            - configMapRef:
                name: {{ include "ai48home.fullname" . }}-worker-env
          env:
            - name: HOME_JWT_FILE
              value: /var/lib/ai48proxy/.home-jwt
          ports:
            - name: http
              containerPort: 8317
          # /healthz returns 200 only while the worker is connected to Home.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: {{ add 60 (div (add (int .Values.workers.startDelaySeconds) (mul (int (ternary .Values.workers.autoscaling.maxReplicas .Values.workers.replicas .Values.workers.autoscaling.enabled)) 2)) 5) }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.workers.resources | nindent 12 }}
          volumeMounts:
            - name: identity
              mountPath: /var/lib/ai48proxy
      volumes:
        - name: bootstrap
          configMap:
            name: {{ include "ai48home.fullname" . }}-worker-bootstrap
  volumeClaimTemplates:
    - metadata:
        name: identity
        labels:
          {{- include "ai48home.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "ai48home.storageClass" (dict "persistence" .Values.workers.persistence "global" .Values.global) | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.workers.persistence.size | quote }}
