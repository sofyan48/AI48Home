fullnameOverride: ai48home
clusterDomain: cluster.local

global:
  storageClass: nfs-client

# Leave a key empty to generate a random 48-character value on first install.
# Generated values are stored in the <fullname>-config Secret and reused on upgrades.
# Read them with:
#   kubectl -n <namespace> get secret <fullname>-config -o jsonpath='{.data.management-key}' | base64 -d; echo
#   kubectl -n <namespace> get secret <fullname>-config -o jsonpath='{.data.gateway-api-key}' | base64 -d; echo
secrets:
  managementKey: ""
  gatewayApiKey: ""

bootstrap:
  image: python:3.13-alpine

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: ai48home.example.com
      home:
        path: /home
        pathType: Prefix
      worker:
        path: /
        pathType: Prefix
  tls: []

gateway:
  enabled: false
  parentRefs: []
  hostnames: []
  home:
    path: /home
  worker:
    path: /

home:
  image:
    repository: ghcr.io/sofyan48/ai48home
    tag: latest
    pullPolicy: IfNotPresent
  heartbeatTimeoutSeconds: 20
  environment:
    HOME_USER_EMAIL_SMTP_PASSWORD: ""
  persistence:
    size: 5Gi
    storageClass: nfs-client
  resources: {}
  service:
    type: ClusterIP

workers:
  image:
    repository: ghcr.io/sofyan48/ai48proxy
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  startDelaySeconds: 25
  environment: {}
  persistence:
    size: 5Gi
    storageClass: nfs-client
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    scaleDownStabilizationSeconds: 300

postgresql:
  enabled: false
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  port: 5432
  sslmode: disable
  auth:
    username: ""
    database: ""
    password: ""
  external:
    host: ""
    port: 5432
    sslmode: disable
  environment: {}
  persistence:
    size: 10Gi
  resources: {}
